<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Darshan</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"
        integrity="sha384-cciJ0zi8d1uMKC2zJd7jvPY4HQt7W4ByUI/FlMkltvBi31aW61rcpVBhpmW8/NwX"
        crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #error {
            display: none;
            color: #fff;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }

        #error h2 {
            color: #f4a026;
            margin-bottom: 10px;
        }

        #error p {
            opacity: 0.7;
            font-size: 14px;
            line-height: 1.6;
        }

        #retry-btn {
            margin-top: 16px;
            padding: 10px 24px;
            background: #f4a026;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        #notice {
            display: none;
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            pointer-events: none;
        }

        #retry-btn:hover {
            background: #e0900f;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(244, 160, 38, 0.3);
            border-top-color: #f4a026;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="container">
        <div class="spinner" id="spinner"></div>
        <video id="video" autoplay muted playsinline controls></video>
        <div id="notice">Audio is not supported in this browser &mdash; playing video only.</div>
        <div id="error">
            <h2>Live Darshan Unavailable</h2>
            <p>The live stream is currently inactive or could not be loaded.</p>
            <button id="retry-btn" onclick="loadStream()">Retry</button>
        </div>
    </div>
    <script>
        const video = document.getElementById('video');
        const spinner = document.getElementById('spinner');
        const errorDiv = document.getElementById('error');
        const notice = document.getElementById('notice');

        video.style.display = 'none';

        let hls = null;
        // Set when the browser can't decode the stream's AAC audio (e.g. Chromium/Electron builds without proprietary codecs).
        let videoOnly = false;

        // Retype the AAC entry in the MPEG-TS PMT so hls.js ignores the audio track.
        function dropAacFromPmt(d) {
            let pmtPid = -1;
            for (let i = 0; i + 188 <= d.length; i += 188) {
                if (d[i] !== 0x47 || !(d[i + 1] & 0x40)) continue;
                const pid = ((d[i + 1] & 0x1f) << 8) | d[i + 2];
                if (pid !== 0 && pid !== pmtPid) continue;
                let o = i + 4;
                if (d[i + 3] & 0x20) o += d[o] + 1;
                o += d[o] + 1;
                if (pid === 0) {
                    pmtPid = ((d[o + 10] & 0x1f) << 8) | d[o + 11];
                    continue;
                }
                const end = o + 3 + (((d[o + 1] & 0x0f) << 8) | d[o + 2]) - 4;
                let p = o + 12 + (((d[o + 10] & 0x0f) << 8) | d[o + 11]);
                while (p + 5 <= end) {
                    if (d[p] === 0x0f) d[p] = 0x00;
                    p += 5 + (((d[p + 3] & 0x0f) << 8) | d[p + 4]);
                }
            }
        }

        class VideoOnlyLoader extends Hls.DefaultConfig.loader {
            load(context, config, callbacks) {
                super.load(context, config, {
                    ...callbacks,
                    onSuccess: (response, stats, ctx, net) => {
                        if (response.data instanceof ArrayBuffer) {
                            dropAacFromPmt(new Uint8Array(response.data));
                        }
                        callbacks.onSuccess(response, stats, ctx, net);
                    },
                });
            }
        }

        function showError() {
            spinner.style.display = 'none';
            video.style.display = 'none';
            notice.style.display = 'none';
            errorDiv.style.display = 'block';
        }

        // Get the API base URL from query params or default to localhost:8000
        const params = new URLSearchParams(window.location.search);
        const apiBase = params.get('api') || 'http://localhost:8000/api/v1';

        async function loadStream() {
            spinner.style.display = 'block';
            video.style.display = 'none';
            errorDiv.style.display = 'none';
            if (hls) {
                hls.destroy();
                hls = null;
            }

            try {
                const resp = await fetch(`${apiBase}/live-darshan/stream-url`);
                if (!resp.ok) throw new Error(`API error: ${resp.status}`);
                const data = await resp.json();
                const streamUrl = data.url;

                if (Hls.isSupported()) {
                    hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true,
                        ...(videoOnly ? { fLoader: VideoOnlyLoader } : {}),
                    });
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        spinner.style.display = 'none';
                        video.style.display = 'block';
                        notice.style.display = videoOnly ? 'block' : 'none';
                        video.play().catch(() => { });
                    });
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (!videoOnly && data.type === Hls.ErrorTypes.MEDIA_ERROR &&
                            /audio decoder/i.test(String(data.error))) {
                            videoOnly = true;
                            setTimeout(loadStream, 0);
                            return;
                        }
                        if (data.fatal) showError();
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari native HLS support
                    video.src = streamUrl;
                    video.addEventListener('loadedmetadata', () => {
                        spinner.style.display = 'none';
                        video.style.display = 'block';
                        video.play().catch(() => { });
                    });
                    video.addEventListener('error', () => {
                        spinner.style.display = 'none';
                        video.style.display = 'none';
                        errorDiv.style.display = 'block';
                    });
                } else {
                    throw new Error('HLS not supported');
                }
            } catch (e) {
                console.error('Live Darshan load error:', e);
                showError();
            }
        }

        loadStream();
    </script>
</body>

</html>
