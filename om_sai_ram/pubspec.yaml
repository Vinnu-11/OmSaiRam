name: om_sai_ram
description: An app for organizing group readings of the Sai Baba Satcharita.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^12.0.0

  # Networking
  dio: ^5.3.0

  # Local storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # UI
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Auth
  google_sign_in: ^6.1.0
  sign_in_with_apple: ^5.0.0

  # Audio / download
  url_launcher: ^6.2.0
  just_audio: ^0.9.36
  path_provider: ^2.1.2

  # WebView for live darshan stream
  webview_flutter: ^4.4.0

  # Utils
  intl: ^0.20.2
  json_annotation: ^4.8.0
  equatable: ^2.0.5
  uuid: ^4.1.0

  # Notifications
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/images/
    - assets/i18n/
